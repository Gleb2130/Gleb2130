<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none">
  <title>Monochrome fourth-dimensional optical illusion</title>
  <desc>Transparent monochrome abstract projection of a rotating tesseract, with nested impossible geometry, orbital curves and fine particles.</desc>
  <defs>
    <linearGradient id="silver" x1="230" y1="40" x2="970" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F8FA" stop-opacity=".08"/>
      <stop offset=".32" stop-color="#E6E8EB" stop-opacity=".82"/>
      <stop offset=".68" stop-color="#AEB4BC" stop-opacity=".42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="bright" x1="350" y1="65" x2="850" y2="295" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="mist">
      <stop stop-color="#FFFFFF" stop-opacity=".10"/>
      <stop offset=".58" stop-color="#FFFFFF" stop-opacity=".025"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".65" fill="#FFFFFF" opacity=".12"/>
    </pattern>
    <mask id="edgeFade">
      <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
        <stop stop-color="black"/>
        <stop offset=".15" stop-color="white"/>
        <stop offset=".85" stop-color="white"/>
        <stop offset="1" stop-color="black"/>
      </linearGradient>
      <rect width="1200" height="360" fill="url(#fade)"/>
    </mask>
  </defs>

  <!-- Transparent canvas: all atmosphere is made from low-opacity white geometry. -->
  <ellipse cx="600" cy="180" rx="390" ry="145" fill="url(#mist)"/>
  <ellipse cx="600" cy="180" rx="230" ry="90" fill="#FFFFFF" opacity=".035" filter="url(#haze)"/>
  <rect width="1200" height="360" fill="url(#dots)" opacity=".28" mask="url(#edgeFade)"/>

  <!-- Distant mathematical field: faint, almost engraved curves. -->
  <g stroke="#DDE1E6" stroke-width=".8" opacity=".17">
    <path d="M180 180 C330 8 470 8 600 180 C730 352 870 352 1020 180"/>
    <path d="M180 180 C330 352 470 352 600 180 C730 8 870 8 1020 180"/>
    <path d="M260 75 C430 140 770 220 940 285"/>
    <path d="M260 285 C430 220 770 140 940 75"/>
    <ellipse cx="600" cy="180" rx="360" ry="118"/>
    <ellipse cx="600" cy="180" rx="290" ry="76" transform="rotate(-24 600 180)"/>
  </g>

  <!-- The tesseract: two linked cubes, drawn as a 4D projection. -->
  <g transform="translate(600 180)">
    <g id="hypercube" stroke-linejoin="round" stroke-linecap="round">
      <!-- outer projected cube -->
      <path d="M0 -126 L132 -70 L126 72 L-8 132 L-132 65 L-126 -76 Z"
            stroke="url(#silver)" stroke-width="1.45" opacity=".86"/>
      <path d="M0 -126 L-8 132 M132 -70 L-126 -76 M126 72 L-132 65"
            stroke="#FFFFFF" stroke-width="1" opacity=".38"/>
      <!-- inner cube, offset in the fourth axis -->
      <path d="M0 -66 L70 -34 L66 38 L-4 70 L-70 34 L-66 -38 Z"
            stroke="#FFFFFF" stroke-width="1.6" opacity=".92"/>
      <path d="M0 -126 L0 -66 M132 -70 L70 -34 M126 72 L66 38 L-8 132 L-4 70 M-132 65 L-70 34 L-126 -76 L-66 -38"
            stroke="url(#bright)" stroke-width="1.25" opacity=".72"/>
      <!-- 4D cross-connections -->
      <path d="M0 -126 L70 -34 M132 -70 L-4 70 M126 72 L-70 34 M-8 132 L-66 -38 M-132 65 L66 38 M-126 -76 L-4 70"
            stroke="#E9EDF2" stroke-width=".85" opacity=".44"/>
      <!-- central perspective facets -->
      <path d="M0 -66 L0 0 L66 38 M0 0 L-66 -38 M0 0 L-4 70 M0 0 L70 -34"
            stroke="#FFFFFF" stroke-width="1.1" opacity=".68"/>
      <path d="M-70 34 L0 0 L70 -34 M-66 -38 L0 0 L66 38"
            stroke="#FFFFFF" stroke-width=".8" opacity=".32"/>
      <circle cx="0" cy="0" r="2.2" fill="#FFFFFF" filter="url(#softGlow)"/>
    </g>

    <!-- A second, offset projection creates the impossible dimensional fold. -->
    <g transform="rotate(18) scale(.72)" opacity=".36" stroke="#FFFFFF" stroke-width=".8">
      <path d="M0 -126 L132 -70 L126 72 L-8 132 L-132 65 L-126 -76 Z"/>
      <path d="M0 -126 L-8 132 M132 -70 L-126 -76 M126 72 L-132 65"/>
      <path d="M0 -66 L70 -34 L66 38 L-4 70 L-70 34 L-66 -38 Z"/>
      <path d="M0 -126 L70 -34 M132 -70 L-4 70 M126 72 L-70 34 M-8 132 L-66 -38 M-132 65 L66 38 M-126 -76 L-4 70"/>
    </g>

    <!-- Rotating orbit rings in different planes. -->
    <g stroke="#F2F4F7" stroke-width=".9" opacity=".38">
      <ellipse rx="206" ry="66" transform="rotate(28)"/>
      <ellipse rx="206" ry="66" transform="rotate(-28)"/>
      <ellipse rx="174" ry="94" transform="rotate(72)"/>
      <ellipse rx="174" ry="94" transform="rotate(-72)"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="1.15" opacity=".68">
      <path d="M-210 0 C-118 -96 118 -96 210 0" />
      <path d="M-210 0 C-118 96 118 96 210 0" />
    </g>
  </g>

  <!-- Subtle dimensional echo lines, trailing off into the transparent edges. -->
  <g stroke="#FFFFFF" stroke-width=".8" opacity=".24">
    <path d="M245 180 C360 112 435 102 493 130"/>
    <path d="M245 180 C360 248 435 258 493 230"/>
    <path d="M955 180 C840 112 765 102 707 130"/>
    <path d="M955 180 C840 248 765 258 707 230"/>
  </g>

  <!-- Tiny suspended points, kept monochrome. -->
  <g fill="#FFFFFF">
    <circle cx="245" cy="180" r="1.5" opacity=".5"/>
    <circle cx="360" cy="112" r="1.1" opacity=".42"/>
    <circle cx="360" cy="248" r="1.1" opacity=".42"/>
    <circle cx="955" cy="180" r="1.5" opacity=".5"/>
    <circle cx="840" cy="112" r="1.1" opacity=".42"/>
    <circle cx="840" cy="248" r="1.1" opacity=".42"/>
    <circle cx="600" cy="27" r="1.3" opacity=".65"/>
    <circle cx="600" cy="333" r="1.3" opacity=".65"/>
    <circle cx="430" cy="54" r="1" opacity=".38"/>
    <circle cx="770" cy="306" r="1" opacity=".38"/>
  </g>

  <!-- Slow movement: the projected 4D object rotates and breathes, not flashes. -->
  <g>
    <animateTransform href="#hypercube" attributeName="transform" type="rotate"
      values="0;3;0;-3;0" dur="28s" repeatCount="indefinite"/>
    <ellipse cx="600" cy="180" rx="235" ry="105" stroke="#FFFFFF" stroke-width=".7" opacity=".22">
      <animate attributeName="rx" values="220;242;220" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="96;112;96" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".12;.3;.12" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="2" fill="#FFFFFF" filter="url(#softGlow)">
      <animateMotion dur="19s" repeatCount="indefinite"
        path="M390 180 C470 45 730 45 810 180 C730 315 470 315 390 180"/>
      <animate attributeName="opacity" values=".18;.85;.18" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle r="1.5" fill="#FFFFFF" opacity=".7">
      <animateMotion dur="23s" repeatCount="indefinite"
        path="M600 28 C830 90 830 270 600 332 C370 270 370 90 600 28"/>
    </circle>
  </g>
</svg>
